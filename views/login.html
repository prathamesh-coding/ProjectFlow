<div class="row justify-content-center pt-5">
  <div class="col-md-5">
    <div class="card p-4 shadow-sm border-0">
      <h3 class="mb-4 fw-bold">Log In to ProjectFlow</h3>
      <div class="alert alert-danger" ng-if="error">{{error}}</div>
      <form ng-submit="login()">
        <div class="mb-3">
          <label class="form-label fw-bold text-muted small text-uppercase">Email Address</label>
          <input type="email" class="form-control form-control-lg" ng-model="user.email" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold text-muted small text-uppercase">Password</label>
          <input type="password" class="form-control form-control-lg" ng-model="user.password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3 fw-bold" ng-disabled="isLoading">
          <span ng-if="isLoading" class="spinner-border spinner-border-sm me-2"></span>
          Log In
        </button>
        <div class="text-center mt-3">
          <span class="text-muted">Don't have an account?</span>
          <a href="#!/register" class="text-decoration-none fw-bold ms-1 text-primary">Sign Up</a>
        </div>
      </form>
    </div>
  </div>
</div>
